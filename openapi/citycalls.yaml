      summary: Verify the completion OTP (permission serviceRequests.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties: { otp: { type: string, minLength: 6, maxLength: 6 } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /service-requests/{id}/location-ping:
    post:
      tags: [ServiceRequests]
      summary: Record a technician location ping (permission serviceRequests.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties: { lat: { type: number }, lng: { type: number } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ─────────────────────────── Field Execution ───────────────────────────
  /service-requests/{id}/visits:
    get:
      tags: [FieldExecution]
      summary: List visits for a service request (permission fieldExecution.view)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Visits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/ServiceVisit' } } }
  /service-requests/{id}/visits/inspection:
    patch:
      tags: [FieldExecution]
      summary: Record inspection findings on the technician's current open visit (permission fieldExecution.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defectFound: { type: string }
                symptoms: { type: array, items: { type: string } }
                solutionType: { type: string }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }
  /service-requests/{id}/visits/parts:
    post:
      tags: [FieldExecution]
      summary: Add parts used on the current visit (permission fieldExecution.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, qty, unitPrice]
                    properties:
                      partId: { type: string }
                      name: { type: string }
                      qty: { type: number }
                      unitPrice: { type: number }
      responses: { '201': { $ref: '#/components/responses/GenericOk' } }
  /service-requests/{id}/visits/work:
    patch:
      tags: [FieldExecution]
      summary: Update work notes / labour charge / before-after images on the current visit (permission fieldExecution.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                labourCharge: { type: number }
                workNotes: { type: string }
                beforeImages: { type: array, items: { type: string } }
                afterImages: { type: array, items: { type: string } }
                nextVisitDate: { type: string, format: date-time }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }
  /service-requests/{id}/visits/complete:
    post:
      tags: [FieldExecution]
      summary: Complete the current visit with a completion proof (permission fieldExecution.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completionProof]
              properties:
                completionProof:
                  type: object
                  required: [type]
                  properties:
                    type: { type: string, enum: [OTP, SIGNATURE, APP_CONFIRMATION] }
                    value: { type: string }
                    url: { type: string }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }
  /service-requests/{id}/sync-batch:
    post:
      tags: [FieldExecution]
      summary: >
        Offline-sync batch (permission fieldExecution.edit) — actions processed
        in client-recorded order, each independently (a bad action is rejected
        on its own, with current status + allowed transitions attached, not the
        whole batch); idempotent via a 24h idempotency-key ledger so a retried
        batch after a dropped connection doesn't double-apply.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actions]
              properties:
                actions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [idempotencyKey, clientTimestamp, actionType]
                    properties:
                      idempotencyKey: { type: string }
                      clientTimestamp: { type: string, format: date-time }
                      actionType: { type: string, enum: [START_VISIT, ARRIVE, UPDATE_INSPECTION, ADD_PARTS, UPDATE_WORK, COMPLETE_VISIT, STATUS_CHANGE] }
                      payload: { type: object }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }

