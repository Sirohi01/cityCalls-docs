openapi: 3.0.3
info:
  title: CityCalls API
  version: 1.0.0
  description: >
    Canonical API contract for the CityCalls backend (citycalls-api), covering
    Phases 1-10 of docs/manish/16-manifest-and-task-checklist.md. This is the
    single source of truth every other repo (citycalls-admin-web,
    citycalls-customer-mobile, citycalls-vendor-mobile) syncs a local copy of
    via scripts/sync-contracts.sh — see
    docs/manish/01-project-and-repository-setup.md §3.

    Every response is wrapped in the standard envelope
    { success, message, data, meta, errors } — see ApiResponseBase below.
    Every endpoint except /auth/login, /auth/refresh, /auth/otp/*, and
    /auth/password/reset* requires a Bearer access token; most additionally
    require a role/module/action permission (RBAC) — the description on each
    operation names the permission key checked
    (module.action, per docs/05-user-roles-and-permissions.md), and the
    dataScope that permission resolves to (OWN/TEAM/SUB_BRANCH/BRANCH/VENDOR/ALL)
    further filters what that caller can see, per docs/17-security-and-audit.md §2.
  contact:
    name: Manish (backend)
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Organization
  - name: Config
    description: Generic master-list engine (docs/09-database-architecture.md §3)
  - name: Employees
  - name: Vendors
  - name: Customers
  - name: Catalog
  - name: Calls
  - name: Leads
  - name: ServiceRequests
  - name: FieldExecution
  - name: Files
  - name: Finance
  - name: VendorFinance
  - name: HappyCalls
  - name: Notifications
  - name: Marketing
  - name: AI
  - name: Reports
  - name: ImportExport

paths:
  # ─────────────────────────── Auth ───────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email/mobile + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: "Email or mobile" }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token's session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Request a login OTP for a mobile number (customer app)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties:
                mobile: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify an OTP and log in (progressively registers the Customer on first verify)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, otp]
              properties:
                mobile: { type: string }
                otp: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: OTP verified, logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/reset-request:
    post:
      tags: [Auth]
      summary: Request a password-reset token (delivered via the notification engine)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string, description: "Email or mobile" }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password using a single-use reset token (forces logout of all sessions)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List my active sessions
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Session' } }
  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke one session
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/sessions/revoke-all:
    post:
      tags: [Auth]
      summary: Revoke every session for the current user (used after a password reset)
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ─────────────────────────── Users ───────────────────────────
  /users:
    get:
      tags: [Users]
      summary: List users (permission users.view)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: branchId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/UserListOk' }
    post:
      tags: [Users]
      summary: Create a user (permission users.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mobile, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                mobile: { type: string }
                password: { type: string, minLength: 8 }
                role: { $ref: '#/components/schemas/Role' }
                branchId: { type: string }
                subBranchId: { type: string }
                teamId: { type: string }
                vendorId: { type: string }
      responses:
        '201': { $ref: '#/components/responses/UserOk' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user (permission users.view)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { $ref: '#/components/responses/UserOk' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Update a user (permission users.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
                branchId: { type: string }
                subBranchId: { type: string }
                teamId: { type: string }
                vendorId: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200': { $ref: '#/components/responses/UserOk' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Organization ───────────────────────────
  /branches:
    get:
      tags: [Organization]
      summary: List branches (permission organization.view)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Branch' } }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Organization]
      summary: Create a branch (permission organization.create)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Branch' } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /branches/{id}:
    get:
      tags: [Organization]
      summary: Get a branch (permission organization.view)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Branch' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organization]
      summary: Update a branch (permission organization.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Branch' } }
  /sub-branches:
    get:
      tags: [Organization]
      summary: List sub-branches (permission organization.view)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/GenericListOk' } }
    post:
      tags: [Organization]
      summary: Create a sub-branch (permission organization.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, name, code]
              properties:
                branchId: { type: string }
                name: { type: string }
                code: { type: string }
                coverage: { type: object, properties: { pinCodes: { type: array, items: { type: string } } } }
                managerId: { type: string }
      responses: { '201': { $ref: '#/components/responses/GenericOk' } }
  /sub-branches/{id}:
    patch:
      tags: [Organization]
      summary: Update a sub-branch (permission organization.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }
  /teams:
    get:
      tags: [Organization]
      summary: List teams (permission organization.view)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/GenericListOk' } }
    post:
      tags: [Organization]
      summary: Create a team (permission organization.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, name]
              properties:
                branchId: { type: string }
                subBranchId: { type: string }
                name: { type: string }
                leadId: { type: string }
                memberIds: { type: array, items: { type: string } }
      responses: { '201': { $ref: '#/components/responses/GenericOk' } }
  /teams/{id}:
    patch:
      tags: [Organization]
      summary: Update a team (permission organization.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }

  # ─────────────────────────── Config / Masters ───────────────────────────
  /masters/{masterType}:
    get:
      tags: [Config]
      summary: List master entries of a given type (permission config.view)
      parameters:
        - { name: masterType, in: path, required: true, schema: { $ref: '#/components/schemas/MasterType' } }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: active, in: query, schema: { type: boolean } }
        - { name: parentId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Masters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Master' } }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Config]
      summary: Create a master entry (permission config.manageSettings)
      parameters:
        - { name: masterType, in: path, required: true, schema: { $ref: '#/components/schemas/MasterType' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, label]
              properties:
                key: { type: string }
                label: { type: string }
                parentId: { type: string }
                meta: { type: object }
                sortOrder: { type: integer }
                active: { type: boolean }
      responses: { '201': { $ref: '#/components/responses/GenericOk' } }
  /masters/{masterType}/{id}:
    patch:
      tags: [Config]
      summary: Update a master entry (permission config.manageSettings)
      parameters:
        - { name: masterType, in: path, required: true, schema: { $ref: '#/components/schemas/MasterType' } }
        - { $ref: '#/components/parameters/IdParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }
    delete:
      tags: [Config]
      summary: Delete a master entry (permission config.manageSettings)
      parameters:
        - { name: masterType, in: path, required: true, schema: { $ref: '#/components/schemas/MasterType' } }
        - { $ref: '#/components/parameters/IdParam' }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ─────────────────────────── Employees ───────────────────────────
  /employees:
    get:
      tags: [Employees]
      summary: List employees (permission employees.view)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: branchId, in: query, schema: { type: string } }
        - { name: skill, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Employees
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Employee' } }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Employees]
      summary: Create an employee record for an existing user (permission employees.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, branchId]
              properties:
                userId: { type: string }
                branchId: { type: string }
                subBranchId: { type: string }
                teamId: { type: string }
                skills: { type: array, items: { type: string } }
                certifications: { type: array, items: { type: string } }
                dailyCapacity: { type: integer, default: 5 }
      responses: { '201': { $ref: '#/components/responses/GenericOk' } }
  /employees/{id}:
    get:
      tags: [Employees]
      summary: Get an employee (permission employees.view)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Employee
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Employee' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Employees]
      summary: Update an employee (permission employees.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }

  # ─────────────────────────── Vendors ───────────────────────────
  /vendors:
    get:
      tags: [Vendors]
      summary: List vendors (permission vendors.view)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: pinCode, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: blacklisted, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Vendors
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Vendor' } }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Vendors]
      summary: Onboard a vendor (permission vendors.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName]
              properties:
                companyName: { type: string }
                contactPersons:
                  type: array
                  items:
                    type: object
                    properties: { name: { type: string }, mobile: { type: string }, role: { type: string } }
                serviceAreas: { type: object, properties: { pinCodes: { type: array, items: { type: string } } } }
                servicesOffered: { type: array, items: { type: string } }
                brandsHandled: { type: array, items: { type: string } }
                productTypesHandled: { type: array, items: { type: string } }
                skills: { type: array, items: { type: string } }
                gst: { type: string }
                pan: { type: string }
                commissionModel: { type: string, enum: [FIXED, SERVICE_WISE], default: FIXED }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Vendor' } }
  /vendors/{id}:
    get:
      tags: [Vendors]
      summary: Get a vendor (permission vendors.view)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Vendor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Vendor' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Vendors]
      summary: Update a vendor (permission vendors.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }
  /vendors/{id}/blacklist:
    patch:
      tags: [Vendors]
      summary: Blacklist / un-blacklist a vendor (permission vendors.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blacklisted]
              properties:
                blacklisted: { type: boolean }
                blacklistReason: { type: string }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }
  /vendors/{id}/technicians:
    get:
      tags: [Vendors]
      summary: List a vendor's technician roster (permission vendors.view)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { $ref: '#/components/responses/GenericListOk' } }
    post:
      tags: [Vendors]
      summary: Add a technician to a vendor's roster (permission vendors.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, vendorId]
              properties:
                userId: { type: string }
                vendorId: { type: string }
                skills: { type: array, items: { type: string } }
      responses: { '201': { $ref: '#/components/responses/GenericOk' } }

  # ─────────────────────────── Customers ───────────────────────────
  /customers:
    get:
      tags: [Customers]
      summary: List customers (permission customers.view)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: customerType, in: query, schema: { type: string, enum: [INDIVIDUAL, BUSINESS] } }
        - { name: blacklisted, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, description: "matches name or contact mobile" } }
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Customers]
      summary: Create a customer (permission customers.create; runs non-blocking duplicate detection)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Created — data.customer is the record, data.potentialDuplicates flags near-matches without blocking creation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          customer: { $ref: '#/components/schemas/Customer' }
                          potentialDuplicates: { type: array, items: { type: object } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/duplicates:
    get:
      tags: [Customers]
      summary: Find potential duplicate customers by mobile/gstin/businessName/name (permission customers.view)
      parameters:
        - { name: mobile, in: query, schema: { type: string } }
