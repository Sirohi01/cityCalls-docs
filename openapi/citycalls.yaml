                  - type: object
                    properties: { data: { $ref: '#/components/schemas/HappyCall' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /happy-calls/{id}/outcome:
    patch:
      tags: [HappyCalls]
      summary: >
        Record the outcome (permission happyCalls.edit). COMPLETED closes the
        linked Service Request; UNREACHABLE retries up to 2 times before
        closing anyway.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/HappyCallStatus' }
                outcome: { type: string }
                customerSatisfaction: { type: integer, minimum: 1, maximum: 5 }
                remarks: { type: string }
                reopenRequested: { type: boolean, default: false }
                escalationRequired: { type: boolean, default: false }
                nextFollowUpDate: { type: string, format: date-time }
                recordingUrl: { type: string }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }
  /happy-calls/{id}/reassign:
    patch:
      tags: [HappyCalls]
      summary: Reassign a happy call to a different performer (permission happyCalls.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedTo]
              properties: { assignedTo: { type: string } }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }

  # ─────────────────────────── Notifications ───────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: List my notifications (self-scoped, no permission check)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/NotificationChannel' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/NotificationStatus' } }
        - { name: unreadOnly, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: My unread notification count (self-scoped)
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { type: object, properties: { count: { type: integer } } } }
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one of my notifications as read (self-scoped)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }
  /notification-templates:
    get:
      tags: [Notifications]
      summary: List notification templates (permission config.manageSettings)
      parameters:
        - { name: triggerKey, in: query, schema: { type: string } }
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationTemplate' } } }
  /notification-templates/{id}:
    patch:
      tags: [Notifications]
      summary: Update a notification template's copy (permission config.manageSettings)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subjectTemplate: { type: string }
                bodyTemplate: { type: string }
                active: { type: boolean }
      responses: { '200': { $ref: '#/components/responses/GenericOk' } }

  # ─────────────────────────── Marketing ───────────────────────────
  /campaigns:
    get:
      tags: [Marketing]
      summary: List campaigns (permission marketing.view)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CampaignStatus' } }
        - { name: channel, in: query, schema: { type: string, enum: [WHATSAPP, EMAIL] } }
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Marketing]
      summary: Create a campaign (permission marketing.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, channel, templateId, audienceFilter]
              properties:
                name: { type: string }
                channel: { type: string, enum: [WHATSAPP, EMAIL] }
                templateId: { type: string, description: "Must reference a NotificationTemplate on the same channel" }
                audienceFilter:
                  type: object
                  properties:
                    tags: { type: array, items: { type: string } }
                    segments: { type: array, items: { type: string } }
                    customerType: { type: string, enum: [INDIVIDUAL, BUSINESS] }
                scheduledAt: { type: string, format: date-time }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Campaign' } }
        '409': { $ref: '#/components/responses/Conflict' }
  /campaigns/{id}:
    get:
      tags: [Marketing]
      summary: Get a campaign (permission marketing.view)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Campaign' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{id}/send:
    post:
      tags: [Marketing]
      summary: >
        Send now — resolves the audience via tags/segments/customerType AND
        per-channel marketing consent = GRANTED, sends individually, tracks
        stats.{sent,failed} (permission marketing.edit)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses: { '200': { $ref: '#/components/responses/GenericOk' }, '409': { $ref: '#/components/responses/Conflict' } }

  # ─────────────────────────── AI ───────────────────────────
  /ai/settings:
    get:
      tags: [AI]
      summary: Get the global AI settings (permission ai.manageSettings)
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/AiSettings' } }
    patch:
      tags: [AI]
      summary: Update AI settings — provider/model, per-feature flags, usage caps (permission ai.manageSettings)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [GEMINI, OPENAI] }
                model: { type: string }
                enabled: { type: boolean }
                featureFlags:
                  type: object
                  properties:
                    CALL_SUMMARIZATION: { type: boolean }
                    COMPLAINT_CLASSIFICATION: { type: boolean }
                usageLimits:
                  type: object
                  properties:
                    maxRequestsPerDay: { type: integer }
                    maxTokensPerDay: { type: integer }
                    perRoleMaxRequestsPerDay: { type: object, additionalProperties: { type: integer } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/AiSettings' } }
  /ai/summarize-call:
    post:
      tags: [AI]
      summary: >
        Summarize a call's notes (permission ai.create). Always returns 200
        with { aiAvailable, reason? , text? } — never blocks the caller's
        workflow, even when AI is disabled/over-cap/unconfigured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Provide either callId or text"
              properties:
                callId: { type: string }
                text: { type: string, maxLength: 10000 }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/AiFeatureResult' } }
  /ai/classify-complaint:
    post:
      tags: [AI]
      summary: >
        Classify complaint text into one of the given (or, if omitted, the
        active SERVICE_CATEGORY masters') categories (permission ai.create).
        Same never-blocks response shape as /ai/summarize-call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 10000 }
                categories: { type: array, items: { type: string } }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/AiFeatureResult' } }

  # ─────────────────────────── Reports ───────────────────────────
  /reports/{reportKey}:
    get:
      tags: [Reports]
      summary: >
        Run a report (permission reports.view). Every report is a live Mongo
        aggregation (not pre-aggregated) — see reportKey enum for the six
        available reports. A BRANCH-scoped caller is pinned to their own
        branch regardless of the branchId query param.
      parameters:
        - name: reportKey
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ReportKey' }
        - { name: branchId, in: query, schema: { type: string } }
        - { name: dateFrom, in: query, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Report result — shape depends on reportKey (see docs/manish/16 Phase 10 notes)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { type: object, description: "Report-specific shape" } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────── Import / Export ───────────────────────────
  /export/{entity}:
    get:
      tags: [ImportExport]
      summary: >
        Export an entity as CSV or XLSX (permission {entity}.export, dynamically
        resolved — see src/modules/import-export/dynamicPermission.ts). Capped
        at 20,000 rows synchronously; narrower filters are required above that.
        Registered entities: customers, leads, serviceRequests, calls, invoices.
      parameters:
        - name: entity
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ExportEntity' }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: csv } }
        - { name: columns, in: query, schema: { type: string, description: "comma-separated, must be a subset of that entity's default column list" } }
      responses:
        '200':
          description: File download (text/csv or application/vnd.openxmlformats-officedocument.spreadsheetml.sheet), Content-Disposition attachment
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /import/{entity}:
    post:
      tags: [ImportExport]
      summary: >
        Import an entity from a CSV file (permission {entity}.import, dynamically
        resolved). XLSX is intentionally not accepted for import — the `xlsx`
        (SheetJS) package's parsing path has two unpatched high-severity
        advisories (prototype pollution, ReDoS) with no fix on the npm
        registry, and import parses arbitrary user-uploaded files, so it never
        calls into that code path (hand-rolled CSV parsing instead, no
        third-party dependency). Export still writes .xlsx via XLSX.write,
        since that path only ever serializes trusted internal data. Revisit
        before a real deployment (Phase 11 security review) or if SheetJS
        ships a patched release. Registered entities: customers, leads.
      parameters:
        - name: entity
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ImportEntity' }
        - { name: dryRun, in: query, schema: { type: boolean, default: false } }
        - { name: mode, in: query, schema: { type: string, enum: [partial, strict], default: partial } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: ".csv only — .xlsx is rejected with a 422" }
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/ImportResult' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /auth/login, /auth/refresh, or /auth/otp/verify.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Ok:
      description: Success (no meaningful data payload)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseBase' }
    GenericOk:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseBase'
              - type: object
                properties: { data: { type: object } }
    GenericListOk:
      description: Success (list)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseBase'
              - type: object
                properties:
                  data: { type: array, items: { type: object } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    UserOk:
      description: User
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseBase'
              - type: object
                properties: { data: { $ref: '#/components/schemas/User' } }
    UserListOk:
      description: Users
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseBase'
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    Unauthorized:
      description: Missing/invalid/expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseBase' }
    Forbidden:
      description: Authenticated but lacks the required module.action permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseBase' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseBase' }
    Conflict:
      description: Business-rule conflict (e.g. invalid status transition, already-sent campaign)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseBase' }
    ValidationError:
      description: Request body/query/params failed schema validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseBase' }

  schemas:
    # ── Envelope ──
    ApiResponseBase:
      type: object
      required: [success, message, data, meta, errors]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
        meta: { $ref: '#/components/schemas/PaginationMeta' }
        errors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    PaginationMeta:
      type: object
      nullable: true
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            role: { $ref: '#/components/schemas/Role' }
    Session:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }

    # ── Shared enums ──
    Role:
      type: string
      enum: [SUPER_ADMIN, ADMIN, OPERATIONS_ADMIN, BRANCH_ADMIN, SUB_BRANCH_ADMIN, BRANCH_MANAGER, TEAM_LEAD, EMPLOYEE, TECHNICIAN, CALL_EXECUTIVE, CUSTOMER_SUPPORT_EXECUTIVE, HAPPY_CALL_EXECUTIVE, SALES_EXECUTIVE, MARKETING_EXECUTIVE, FINANCE_EXECUTIVE, ACCOUNTANT, VENDOR_OWNER, VENDOR_MANAGER, VENDOR_TECHNICIAN, OUTSOURCED_PARTNER, CUSTOMER, BUSINESS_CUSTOMER]
    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH, URGENT]
    MasterType:
      type: string
      enum: [SERVICE_CATEGORY, BRAND, PRODUCT_TYPE, SYMPTOM, DEFECT, SOLUTION, PART, UNIT, TAX_RATE, PRIORITY, LEAD_SOURCE, CALL_TYPE, APPOINTMENT_SLOT, PAYMENT_METHOD]
    CallType:
      type: string
      enum: [INITIAL, REQUIREMENT, PRE_SERVICE, VISIT_UPDATE, POST_SERVICE_FOLLOWUP, HAPPY_CALL]
    LeadStage:
      type: string
      enum: [NEW, CONTACT_ATTEMPTED, CONNECTED, REQUIREMENT_COLLECTED, QUALIFIED, ESTIMATE_REQUIRED, ESTIMATE_SHARED, NEGOTIATION, FOLLOW_UP, CONVERTED, LOST, NOT_INTERESTED, INVALID, DUPLICATE]
    ServiceRequestStatus:
      type: string
      enum: [NEW, NEEDS_MANUAL_BRANCH_ASSIGNMENT, ASSIGNED_TO_BRANCH, ASSIGNED_TO_SUB_BRANCH, ASSIGNED_TO_TEAM, ASSIGNED_TO_EMPLOYEE, ASSIGNED_TO_VENDOR, OUTSOURCED, REASSIGNMENT_REQUIRED, ACCEPTED, APPOINTMENT_SCHEDULED, RESCHEDULED, CUSTOMER_UNAVAILABLE, TECHNICIAN_EN_ROUTE, TECHNICIAN_ARRIVED, INSPECTION_STARTED, INSPECTION_COMPLETED, ESTIMATE_PENDING, ESTIMATE_SHARED, AWAITING_CUSTOMER_APPROVAL, ESTIMATE_APPROVED, ESTIMATE_REJECTED, PARTS_PENDING, WORK_STARTED, WORK_IN_PROGRESS, ON_HOLD, SERVICE_COMPLETED, CUSTOMER_CONFIRMATION_PENDING, PAYMENT_PENDING, PARTIALLY_PAID, PAID, FOLLOW_UP_PENDING, HAPPY_CALL_PENDING, CLOSED, REOPENED, CANCELLED]
    AssigneeType:
      type: string
      enum: [BRANCH, SUB_BRANCH, TEAM, EMPLOYEE, VENDOR, OUTSOURCED_PARTNER]
    EstimateStatus:
      type: string
      enum: [DRAFT, SHARED, APPROVED, REJECTED, EXPIRED, CONVERTED]
    ProformaInvoiceStatus:
      type: string
      enum: [DRAFT, SHARED, ACCEPTED, CONVERTED, CANCELLED]
    InvoiceStatus:
      type: string
      enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, CANCELLED]
    PaymentMethod:
      type: string
      enum: [CASH, UPI, CARD, BANK_TRANSFER, GATEWAY, CHEQUE, CREDIT]
    VendorInvoiceStatus:
      type: string
      enum: [PENDING, APPROVED, PAID, DISPUTED]
    VendorPayoutStatus:
      type: string
      enum: [PENDING, PROCESSING, PAID, FAILED]
    HappyCallStatus:
      type: string
      enum: [PENDING, COMPLETED, UNREACHABLE, RESCHEDULED]
    NotificationChannel:
      type: string
      enum: [IN_APP, PUSH, EMAIL, WHATSAPP, SMS]
    NotificationStatus:
      type: string
      enum: [PENDING, SENT, DELIVERED, READ, FAILED, SKIPPED_INTEGRATION_DISABLED]
    CampaignStatus:
      type: string
      enum: [DRAFT, SCHEDULED, SENDING, COMPLETED, CANCELLED]
    FileCategory:
      type: string
      enum: [ISSUE_IMAGE, PRODUCT_IMAGE, BEFORE_SERVICE_IMAGE, AFTER_SERVICE_IMAGE, PART_IMAGE, VENDOR_DOCUMENT, EMPLOYEE_DOCUMENT, INVOICE_ATTACHMENT, RECORDING, VIDEO, SIGNATURE, PROFILE_IMAGE]
    ReportKey:
      type: string
      enum: [service-request-summary, branch-performance, lead-funnel, revenue-summary, technician-performance, campaign-performance]
    ExportEntity:
      type: string
      enum: [customers, leads, serviceRequests, calls, invoices]
    ImportEntity:
      type: string
      enum: [customers, leads]

    # ── Shared sub-objects ──
    Address:
      type: object
      required: [line1, city, state, pinCode]
      properties:
        label: { type: string }
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        city: { type: string }
        state: { type: string }
        pinCode: { type: string }
        country: { type: string, default: India }
        isDefault: { type: boolean }
        geo: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
    Contact:
      type: object
      required: [mobile]
      properties:
        name: { type: string }
        mobile: { type: string }
        isPrimary: { type: boolean }
    LineItem:
      type: object
      properties:
        description: { type: string }
        partId: { type: string }
        qty: { type: number }
        unitPrice: { type: number }
        taxRateId: { type: string }
        lineTotal: { type: number }
    TaxBreakup:
      type: object
      properties:
        cgst: { type: number }
        sgst: { type: number }
        igst: { type: number }
    FinancialDocumentInput:
      type: object
      required: [customerId, branchId, items]
      properties:
        customerId: { type: string }
        branchId: { type: string }
        serviceRequestId: { type: string }
        leadId: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, qty, unitPrice]
            properties:
              description: { type: string }
              partId: { type: string }
              qty: { type: number }
              unitPrice: { type: number }
              taxRateId: { type: string }
        discount: { type: number, default: 0 }
        validUntil: { type: string, format: date-time, description: "Estimate only" }

    # ── Entities ──
    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        branchId: { type: string }
        subBranchId: { type: string }
        teamId: { type: string }
        vendorId: { type: string }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Branch:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        code: { type: string }
        coverage:
          type: object
          properties:
            pinCodes: { type: array, items: { type: string } }
            cities: { type: array, items: { type: string } }
            states: { type: array, items: { type: string } }
        serviceCategoryIds: { type: array, items: { type: string } }
        workingHours:
          type: array
          items:
            type: object
